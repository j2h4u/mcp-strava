[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-strava"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.3,<1.6",
    "mcp>=1.27.1,<1.28",
    "PyYAML>=6.0.2,<7",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.15",
    "pyright>=1.1.390",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# E4/E7/E9: syntax/logic pycodestyle (formatter owns line length, so no E5).
# F: pyflakes real bugs (unused, undefined). I: import order.
# B: flake8-bugbear likely-bug patterns. UP: pyupgrade -> modern py314 idioms.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
