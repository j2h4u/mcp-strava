[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-strava"
version = "0.1.0"
authors = [{ name = "Maksim Brashchenko" }]
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.3,<1.6",
    "mcp>=1.27.2,<1.28",
    "PyYAML>=6.0.2,<7",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.15.16",
    "basedpyright>=1.39.7",
    "import-linter>=2.3",
    "vulture>=2.14",
    "pytest-xdist>=3.8.0",
    "actionlint-py>=1.7.12.24",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Leave no /tmp residue on green runs (shared host): passed tests' tmp_path dirs are
# removed at session end; only failing tests keep their dir, and only the latest run.
# Flip policy to "none" for zero retention even on failures.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# Bug-catching core:
#   E4/E7/E9: syntax/logic pycodestyle (formatter owns line length, so no E5).
#   F: pyflakes real bugs (unused, undefined). I: import order.
#   B: flake8-bugbear likely-bug patterns. UP: pyupgrade -> modern py314 idioms.
# High-signal additions (low false-positive, fit this codebase's clean/no-dead-code values):
#   C4/PIE/ISC/RSE/FLY: comprehension/misc/concat/raise/f-string tidiness (near-zero hits — regression ratchets).
#   RUF: Ruff-specific (mutable-class-default, unused-unpacked-var=dead code, unsorted __all__).
#   PERF: Perflint (manual loops that should be comprehensions).
#   SIM: flake8-simplify (collapsible-if, yoda conditions, suppressible-exception).
#   PTH: enforce pathlib over os.* (matches the project Python conventions).
#   DTZ: every datetime.now()/strptime must declare tz intent. Instants are explicit UTC-naive
#     (datetime.now(UTC).replace(tzinfo=None), matching the WR-02 freshness basis); the few
#     deliberate local-wall-clock sites (display/calendar) carry an explicit `# noqa: DTZ005`.
#   BLE: broad exception catches require a local justification.
# Deliberately NOT selected: D/ANN (basedpyright owns typing; docstrings not mandated),
#   COM/ISC001 (conflict with the formatter), S101/PLR/TRY003 (test asserts + opinionated noise).
select = ["E4", "E7", "E9", "F", "I", "B", "BLE", "UP", "C4", "PIE", "ISC", "RSE", "FLY", "RUF", "PERF", "SIM", "PTH", "DTZ"]
# RUF001-003: ambiguous-unicode false positives on intentional Cyrillic in comments/docstrings.
# ISC001: single-line implicit string concat — conflicts with `ruff format`.
ignore = ["RUF001", "RUF002", "RUF003", "ISC001"]

[tool.ruff.lint.per-file-ignores]
# PERF401 (manual list-comprehension) is a runtime-perf lint; test fixtures build
# data for clarity, not speed — the loop form is fine there.
# DTZ: tests construct fixed naive datetimes deliberately to pin behavior.
"tests/**" = ["PERF401", "DTZ"]

[tool.ruff.format]
quote-style = "double"

# Type checking. Read by both basedpyright (CI gate) and pyright/Pylance (IDE);
# basedpyright reads this [tool.pyright] table. basedpyright is a strict pyright
# fork (bundles pyright 1.1.410). We keep standard mode and turn ON `reportAny`
# — the rule that flags expressions of type `Any`, the exact blind spot that let
# `row['id']` on a raw DB-API tuple ship past type checking (fetchall() ->
# list[Any]). We deliberately do NOT adopt basedpyright's whole strict family
# (reportUnknown*/reportMissing*) — that is a separate typing-hardening effort
# that would bury the signal — so those are silenced. There is no baseline file:
# CI fails on every `reportAny` diagnostic currently visible in `src`. (pyright
# ignores the basedpyright-only rule names it does not recognize.)
[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportAny = "error"
reportExplicitAny = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingParameterType = "none"
reportMissingTypeArgument = "none"
reportUnannotatedClassAttribute = "none"
reportUnusedCallResult = "none"
reportImplicitStringConcatenation = "none"
reportPrivateUsage = "none"

# Architectural layer contracts (import-linter). Enforces the clean-architecture
# boundaries the project is organized around, as a CI test. Catches import-level
# drift that ruff/pyright cannot express (e.g. an inner layer importing an outer
# one). Complements basedpyright's reportAny, which catches the Any-typed access
# that let the raw-DB-API kudos bug slip past type checking.
[tool.importlinter]
root_package = "mcp_strava"

[[tool.importlinter.contracts]]
name = "Strava and DuckDB adapters stay independent"
type = "independence"
modules = [
    "mcp_strava.adapters.duckdb",
    "mcp_strava.adapters.strava",
]

[[tool.importlinter.contracts]]
name = "Pure domain is free of infrastructure and outer layers"
type = "forbidden"
source_modules = [
    "mcp_strava.metrics",
    "mcp_strava.cardiac_drift",
    "mcp_strava.training",
    "mcp_strava.hr_zones",
    "mcp_strava.sports",
]
forbidden_modules = [
    "mcp_strava.adapters",
    "mcp_strava.application",
    "mcp_strava.refresh",
    "mcp_strava.interfaces",
]

[[tool.importlinter.contracts]]
name = "Adapters do not depend on outer layers"
type = "forbidden"
source_modules = [
    "mcp_strava.adapters",
]
forbidden_modules = [
    "mcp_strava.application",
    "mcp_strava.refresh",
    "mcp_strava.interfaces",
]
