services:
  mcp-strava:
    container_name: mcp-strava
    init: true
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    mem_limit: 4g
    restart: unless-stopped
    environment:
      MCP_STRAVA_RUNTIME_PROFILE: container
      MCP_STRAVA_HTTP_HOST: 0.0.0.0
      MCP_STRAVA_HTTP_PORT: "8080"
      MCP_STRAVA_ALLOW_CONTAINER_BIND: "1"
      MCP_STRAVA_ALLOWED_HOSTS: 127.0.0.1:8080,localhost:8080,mcp-strava:8080,mcp-strava
      MCP_STRAVA_ALLOWED_ORIGINS: http://127.0.0.1:8080,http://localhost:8080,http://mcp-strava:8080
      MCP_STRAVA_DB_PATH: /runtime/data/strava.duckdb
      MCP_STRAVA_TOKEN_PATH: /runtime/.env
      # Settings reads the single canonical /runtime/.env for config (incl. the
      # untracked MCP_STRAVA_HR_REST physiology value) — kept out of git by design.
      MCP_STRAVA_PROJECT_ROOT: /runtime
      MCP_STRAVA_REFRESH_WORKER_ENABLED: "1"
      MCP_STRAVA_REFRESH_POLL_SECONDS: "60"
      MCP_STRAVA_REFRESH_INTERVAL_SECONDS: "3600"
    volumes:
      # Runtime root holds the secret .env + .env.lock (token flock) beside the
      # compose; PROJECT_ROOT=/runtime resolves config from here.
      - /opt/docker/mcp-strava:/runtime
      # DuckDB mirror lives under /srv (data is separated from the app deploy dir);
      # this nested mount overlays /runtime/data on top of the runtime-root mount.
      # The host path is instance config, not source: override it with MCP_STRAVA_DATA_DIR
      # in an untracked deploy/.env; the default keeps the canonical /srv location.
      - ${MCP_STRAVA_DATA_DIR:-/srv/mcp-strava/data}:/runtime/data
    expose: ["8080"]
    networks:
      - mcp-private-noauth
    # Default profile intentionally avoids host port publication.

networks:
  mcp-private-noauth:
    external: true
    name: mcp-private-noauth
