services:
  mcp-strava:
    container_name: mcp-strava
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      MCP_STRAVA_RUNTIME_PROFILE: container
      MCP_STRAVA_HTTP_HOST: 0.0.0.0
      MCP_STRAVA_HTTP_PORT: "8080"
      MCP_STRAVA_ALLOW_CONTAINER_BIND: "1"
      MCP_STRAVA_ALLOWED_HOSTS: 127.0.0.1:8080,localhost:8080,mcp-strava:8080,mcp-strava
      MCP_STRAVA_ALLOWED_ORIGINS: http://127.0.0.1:8080,http://localhost:8080,http://mcp-strava:8080
      MCP_STRAVA_DB_PATH: /runtime/data/strava.db
      MCP_STRAVA_TOKEN_PATH: /runtime/.env
      MCP_STRAVA_REFRESH_WORKER_ENABLED: "1"
      MCP_STRAVA_REFRESH_POLL_SECONDS: "60"
      MCP_STRAVA_REFRESH_INTERVAL_SECONDS: "3600"
      MCP_STRAVA_STREAM_BACKFILL_BATCH_SIZE: "50"
    volumes:
      - /opt/docker/mcp-strava:/runtime
    expose: ["8080"]
    networks:
      - mcp-backends
    # Default profile intentionally avoids host port publication.

networks:
  mcp-backends:
    external: true
    name: mcp-backends
